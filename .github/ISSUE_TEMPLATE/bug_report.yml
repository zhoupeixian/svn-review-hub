name: 缺陷报告
description: 提交可复现的功能问题
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先检索已有 Issue。不要提交密钥、令牌或未脱敏的业务日志。
  - type: textarea
    id: environment
    attributes:
      label: 版本与环境
      description: 提交号或版本、操作系统、Node.js / 浏览器版本、本地或托管环境。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏日志或截图
