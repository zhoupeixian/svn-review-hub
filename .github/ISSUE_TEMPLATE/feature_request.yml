name: 功能建议
description: 说明实际场景和希望解决的问题
title: '[Feature] '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 当前遇到的问题
      description: 请描述使用场景和影响，避免只列实现方案。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望行为与验收条件
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
