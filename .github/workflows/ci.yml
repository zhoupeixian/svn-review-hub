name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          - os: windows-latest
            node: '24'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Node and jsdom tests
        run: npm run test:unit -- --reporter=default --reporter=junit --outputFile.junit=outputs/test/unit.xml
      - name: Workers tests
        run: npm run test:workers -- --reporter=default --reporter=junit --outputFile.junit=outputs/test/workers.xml
      - name: SQLite repository tests
        run: npm run test:server -- --reporter=default --reporter=junit --outputFile.junit=outputs/test/server.xml
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run build:server
      - run: npm run verify:server
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.os }}-node-${{ matrix.node }}
          path: outputs/test/*.xml
          if-no-files-found: ignore
          retention-days: 14

  container:
    name: Docker deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: docker build -t portal:ci .
      - run: node scripts/verify-server.mjs portal:ci

  ci-passed:
    name: CI passed
    if: always()
    needs: [verify, container]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all verification jobs to pass
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: test "$VERIFY_RESULT" = success && test "$CONTAINER_RESULT" = success
