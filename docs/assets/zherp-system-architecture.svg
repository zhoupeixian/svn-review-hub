<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ZHERP SVN Review Portal 系统架构</title>
  <desc id="desc">展示外部 SVN 审查自动化生成 Markdown 日志，经自动同步或管理员手工上传进入 ZHERP Portal，并分别读写 Cloudflare D1 与 R2；底部为仅用于质量验证的 GitHub Actions CI。</desc>
  <defs>
    <style>
      text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#17324d}
      .title{font-size:38px;font-weight:700}
      .subtitle{font-size:18px;fill:#58708a}
      .section{font-size:21px;font-weight:700}
      .label{font-size:17px;font-weight:700}
      .body{font-size:14px;fill:#425d78}
      .small{font-size:12px;fill:#58708a}
      .box{fill:#fff;stroke:#9ab2c8;stroke-width:1.5}
      .blue{fill:#f5faff;stroke:#4d93d9}
      .green{fill:#f5fcf7;stroke:#54a673}
      .orange{fill:#fff9f0;stroke:#d99a35}
      .purple{fill:#faf7ff;stroke:#9270cf}
      .muted{fill:#fafbfd;stroke:#9ab2c8;stroke-dasharray:7 6}
      .arrow{stroke:#2468a2;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .bi{stroke:#2468a2;stroke-width:2.2;fill:none;marker-start:url(#arrowBack);marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#2468a2"/></marker>
    <marker id="arrowBack" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto"><path d="M9,0 L0,3 L9,6 Z" fill="#2468a2"/></marker>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="40" y="55" class="title">ZHERP SVN Review Portal — 系统架构</text>
  <text x="40" y="84" class="subtitle">基于当前仓库实现整理；SVN 更新、构建与代码审查由本仓库外部自动化完成</text>

  <!-- users -->
  <rect x="690" y="105" rx="12" width="290" height="78" class="blue"/>
  <text x="715" y="135" class="label">浏览器用户</text>
  <text x="715" y="161" class="body">日志检索 · 问题协作 · 归档浏览</text>
  <path d="M835 183 V220" class="arrow"/>

  <rect x="1110" y="105" rx="12" width="400" height="78" class="purple"/>
  <text x="1135" y="135" class="label">全局管理员</text>
  <text x="1250" y="135" class="body">→ OpenAI Sites 身份代理 → 管理员鉴权</text>
  <text x="1250" y="160" class="small">可信身份头</text>
  <path d="M1310 183 V220" class="arrow"/>

  <!-- external -->
  <rect x="35" y="135" rx="14" width="270" height="570" class="muted"/>
  <text x="55" y="170" class="section">外部 SVN 审查流程</text>
  <text x="55" y="195" class="body">（不属于本仓库）</text>

  <rect x="65" y="235" rx="10" width="210" height="95" class="box"/>
  <text x="170" y="278" text-anchor="middle" class="label">SVN 仓库</text>
  <path d="M170 330 V365" class="arrow"/>

  <rect x="65" y="365" rx="10" width="210" height="112" class="box"/>
  <text x="170" y="405" text-anchor="middle" class="label">SVN 更新 / 构建</text>
  <text x="170" y="435" text-anchor="middle" class="label">代码审查自动化</text>
  <path d="M170 477 V510" class="arrow"/>

  <rect x="65" y="510" rx="10" width="210" height="105" class="box"/>
  <text x="170" y="550" text-anchor="middle" class="label">Markdown 审查日志</text>
  <text x="170" y="580" text-anchor="middle" class="small">svn审查日志-*.md</text>
  <path d="M275 562 H345" class="arrow"/>

  <!-- import -->
  <rect x="345" y="165" rx="14" width="300" height="540" class="green"/>
  <text x="365" y="198" class="section">日志导入入口</text>
  <text x="365" y="222" class="body">两种真实入口，汇入同一套导入逻辑</text>

  <rect x="375" y="265" rx="10" width="240" height="185" class="box"/>
  <text x="395" y="298" class="label">自动同步脚本</text>
  <text x="395" y="326" class="body">scripts/sync-local-reviews.mjs</text>
  <text x="395" y="352" class="body">POST /api/reviews</text>
  <rect x="392" y="375" rx="8" width="206" height="56" class="orange"/>
  <text x="405" y="398" class="body">项目级同步密钥</text>
  <text x="405" y="420" class="small">x-review-sync-key · AES-GCM 加密保存</text>

  <rect x="375" y="485" rx="10" width="240" height="165" class="box"/>
  <text x="395" y="518" class="label">管理员手工上传</text>
  <text x="395" y="548" class="body">/projects/{slug}/admin</text>
  <text x="395" y="578" class="body">Markdown 文件（.md）</text>

  <path d="M615 355 H690" class="arrow"/>
  <path d="M615 565 H655 V460 H690" class="arrow"/>
  <text x="625" y="338" class="small">上传 Markdown 审查日志</text>

  <!-- portal -->
  <rect x="690" y="220" rx="14" width="600" height="485" class="blue"/>
  <text x="715" y="258" class="section">ZHERP SVN Review Portal</text>
  <text x="715" y="285" class="subtitle">OpenAI Sites 托管 · Cloudflare Workers Runtime</text>

  <rect x="715" y="310" rx="10" width="550" height="150" class="box"/>
  <text x="735" y="340" class="label">Web 与 API（Next.js App Router）</text>
  <text x="735" y="377" class="body">项目目录 · 日志浏览与详情 · 问题看板 · 归档库</text>
  <text x="735" y="407" class="body">日志管理（上传 / 导出） · 项目管理 · API Routes</text>

  <rect x="715" y="485" rx="10" width="550" height="170" class="purple"/>
  <text x="735" y="515" class="label">核心业务逻辑</text>
  <text x="735" y="550" class="body">Markdown 解析与校验　·　增量导入与状态保持</text>
  <text x="735" y="580" class="body">查询 / 筛选 / FTS5 全文搜索　·　问题状态协作与事件历史</text>
  <text x="735" y="610" class="body">逻辑归档 / 恢复　·　CSV / XLSX 导出</text>
  <text x="735" y="680" class="small">Next.js · React · TypeScript · vinext / Vite · Drizzle ORM</text>

  <!-- storage -->
  <rect x="1340" y="230" rx="12" width="225" height="225" class="green"/>
  <text x="1360" y="265" class="label">Cloudflare D1</text>
  <text x="1360" y="290" class="body">结构化数据</text>
  <text x="1360" y="325" class="body">• 项目与日志元数据</text>
  <text x="1360" y="352" class="body">• Revision</text>
  <text x="1360" y="379" class="body">• Issue 与状态事件</text>
  <text x="1360" y="406" class="body">• 管理员与项目审计</text>
  <text x="1360" y="433" class="body">• FTS5 搜索索引</text>

  <rect x="1340" y="485" rx="12" width="225" height="190" class="orange"/>
  <text x="1360" y="520" class="label">Cloudflare R2</text>
  <text x="1360" y="545" class="body">原始 Markdown 审查日志</text>
  <text x="1360" y="590" class="small">review-logs/{projectSlug}/{date}/...md</text>

  <path d="M1290 350 H1340" class="bi"/>
  <text x="1298" y="330" class="small">结构化数据读写</text>
  <path d="M1290 575 H1340" class="bi"/>
  <text x="1298" y="555" class="small">Markdown 原文读写</text>

  <!-- CI -->
  <rect x="35" y="748" rx="12" width="1530" height="120" class="box"/>
  <text x="55" y="780" class="section">开发与质量验证（不部署生产环境）</text>

  <rect x="55" y="806" rx="8" width="175" height="42" class="box"/>
  <text x="142" y="832" text-anchor="middle" class="label">GitHub Actions CI</text>
  <path d="M230 827 H275" class="arrow"/>
  <rect x="275" y="806" rx="8" width="120" height="42" class="box"/><text x="335" y="832" text-anchor="middle" class="body">npm ci</text>
  <path d="M395 827 H435" class="arrow"/>
  <rect x="435" y="806" rx="8" width="160" height="42" class="box"/><text x="515" y="832" text-anchor="middle" class="body">Node/jsdom Tests</text>
  <path d="M595 827 H635" class="arrow"/>
  <rect x="635" y="806" rx="8" width="140" height="42" class="box"/><text x="705" y="832" text-anchor="middle" class="body">Workers Tests</text>
  <path d="M775 827 H815" class="arrow"/>
  <rect x="815" y="806" rx="8" width="120" height="42" class="box"/><text x="875" y="832" text-anchor="middle" class="body">TypeScript</text>
  <path d="M935 827 H975" class="arrow"/>
  <rect x="975" y="806" rx="8" width="105" height="42" class="box"/><text x="1028" y="832" text-anchor="middle" class="body">ESLint</text>
  <path d="M1080 827 H1120" class="arrow"/>
  <rect x="1120" y="806" rx="8" width="95" height="42" class="box"/><text x="1168" y="832" text-anchor="middle" class="body">Build</text>
  <path d="M1215 827 H1255" class="arrow"/>
  <rect x="1255" y="796" rx="8" width="280" height="62" class="box"/>
  <text x="1275" y="820" class="body">Linux Node 22 / 24</text>
  <text x="1275" y="844" class="body">Windows Node 24</text>
</svg>